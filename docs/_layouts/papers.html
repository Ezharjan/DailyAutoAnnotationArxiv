---
layout: default
---

<!-- Favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏷️</text></svg>">
<!-- Custom CSS and JavaScript -->
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<!-- Clean override stylesheet to ensure no overlaps and sidebar TOC -->
<link rel="stylesheet" href="{{ '/assets/css/site-clean.css' | relative_url }}">
<script src="{{ '/assets/js/site-enhancements.js' | relative_url }}" defer></script>

<div class="paper-dashboard">
  <div class="dashboard-header">
    <h1 class="dashboard-title">{{ page.title | default: "Auto-Annotation Arxiv Daily" }}</h1>
    <p class="last-updated">📅 {{ page.last_updated | default: "Last updated" }}: {{ "now" | date: "%Y-%m-%d" }}</p>
  </div>

  <div class="quick-stats">
    <div class="stat-card">
      <span class="stat-icon">📚</span>
      <span class="stat-label">Research Domains</span>
      <span class="stat-value">12</span>
    </div>
    <div class="stat-card">
      <span class="stat-icon">🔬</span>
      <span class="stat-label">Daily Updates</span>
      <span class="stat-value">24h</span>
    </div>
    <div class="stat-card">
      <span class="stat-icon">🤖</span>
      <span class="stat-label">Auto-Annotation</span>
      <span class="stat-value">Latest</span>
    </div>
  </div>

  {{ content }}
</div>
