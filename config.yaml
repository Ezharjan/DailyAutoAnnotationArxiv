# Auto-Annotation & Annotation Guidelines Arxiv Daily Tracker
# Automatically fetches latest papers in Auto-Annotation, Annotation Guidelines, Foundation Models for Annotation
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "Ezharjan"
repo_name: "DailyAutoAnnotationArxiv"
show_authors: True
show_links: True
show_badge: True
max_results: 15

publish_readme: False
publish_gitpage: True

# file paths
json_readme_path: './docs/auto-annotation-arxiv-daily.json'
json_gitpage_path: './docs/auto-annotation-arxiv-daily-web.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'

# Keywords covering Auto-Annotation, Annotation Guidelines, Foundation Models, Active Learning, Few-Shot Learning
# Aligned with arxiv categories: cs.CV, cs.LG, cs.AI, cs.RO, cs.HC, cs.CL, cs.GR
keywords:
    "Auto-Annotation & Annotation Automation":
        filters: ["Auto-Annotation", "Automatic Annotation", "Automated Labeling",
                  "Annotation Automation", "Annotation Tool", "Annotation Pipeline",
                  "Semi-Automatic Annotation", "Data Annotation", "Label Generation",
                  "Annotation Guidelines", "Annotation Protocol", "Labeling Policy",
                  "Expert-in-the-loop", "Annotation Quality Control"]
    
    "Foundation Models for Vision":
        filters: ["Vision Foundation Model", "VFM", "Visual Foundation Model",
                  "Vision-Language Model", "VLM", "CLIP", "GroundingDINO",
                  "Open-Vocabulary Detection", "Zero-Shot Detection",
                  "Foundation Model Adaptation", "Foundation Model Finetuning",
                  "Prompt Engineering", "Visual Grounding", "Open-Set Detection"]
    
    "Few-Shot & Zero-Shot Learning":
